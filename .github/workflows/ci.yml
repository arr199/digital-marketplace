name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Same services as docker-compose.test.yml
    services:
      mongo:
        image: mongo:7
        ports:
          - 27018:27017
      stripe-mock:
        image: stripe/stripe-mock:v0.197.0
        ports:
          - 12111:12111
      mailpit:
        image: axllent/mailpit:v1.27
        env:
          MP_SMTP_DISABLE_RDNS: 'true'
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      # built in its own step (with the test env baked in) so build output is visible and not
      # counted against the Playwright webServer timeout; playwright.config.ts only starts it in CI
      - run: pnpm exec tsx tests/build-with-test-env.ts

      - run: pnpm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
